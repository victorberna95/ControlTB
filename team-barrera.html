<title>Team Barrera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3EA;
    --bg-soft:#EFE9DA;
    --surface:#FFFDF8;
    --text:#1C2430;
    --muted:#8A8578;
    --border:#DDD6C4;
    --brick:#B2452C;
    --brick-soft:#E7C9BE;
    --olive:#5C7A4F;
    --olive-soft:#DAE3D4;
    --flash:rgba(92,122,79,0.20);

    --sidebar-bg:#1C2430;
    --sidebar-text:#F7F3EA;
    --sidebar-text-dim:rgba(247,243,234,0.65);
    --sidebar-border:rgba(247,243,234,0.14);
    --sidebar-active-bg:rgba(178,69,44,0.16);
    --sidebar-accent:#B2452C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151B;
      --bg-soft:#191D24;
      --surface:#1B1F27;
      --text:#EDE8DC;
      --muted:#948F82;
      --border:#2B2F38;
      --brick:#E2835F;
      --brick-soft:rgba(226,131,95,0.18);
      --olive:#8FB37E;
      --olive-soft:rgba(143,179,126,0.18);
      --flash:rgba(143,179,126,0.22);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151B;
    --bg-soft:#191D24;
    --surface:#1B1F27;
    --text:#EDE8DC;
    --muted:#948F82;
    --border:#2B2F38;
    --brick:#E2835F;
    --brick-soft:rgba(226,131,95,0.18);
    --olive:#8FB37E;
    --olive-soft:rgba(143,179,126,0.18);
    --flash:rgba(143,179,126,0.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num,.brand,.navlabel{font-family:'Oswald',sans-serif;}
  #app{display:flex;min-height:100%;}

  .sidebar{
    width:216px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    padding:26px 0 16px;
    position:relative;
  }
  .sidebar::after{
    content:"";
    position:absolute;
    right:0;top:0;bottom:0;
    width:4px;
    background:repeating-linear-gradient(180deg,var(--sidebar-accent) 0 16px, transparent 16px 32px);
  }
  .brand{
    padding:0 22px 22px;
    border-bottom:1px solid var(--sidebar-border);
    margin-bottom:8px;
  }
  .brand-name{font-size:21px;font-weight:600;letter-spacing:0.3px;line-height:1.15;}
  .brand-sub{display:block;font-size:11.5px;font-weight:400;color:var(--sidebar-text-dim);letter-spacing:0.3px;margin-top:4px;}
  .navitem{
    display:flex;align-items:baseline;gap:10px;
    padding:13px 22px;
    cursor:pointer;
    font-size:16px;
    font-weight:500;
    color:var(--sidebar-text-dim);
    border-left:3px solid transparent;
    transition:color .15s;
  }
  .navitem .lane-num{font-size:12px;color:var(--sidebar-text-dim);width:16px;}
  .navitem:hover{color:var(--sidebar-text);}
  .navitem.active{color:var(--sidebar-text);border-left-color:var(--sidebar-accent);background:var(--sidebar-active-bg);}
  .sync{margin-top:auto;padding:14px 22px 0;font-size:11.5px;color:var(--sidebar-text-dim);border-top:1px solid var(--sidebar-border);padding-top:14px;display:flex;align-items:center;gap:7px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#5C7A4F;box-shadow:0 0 0 3px rgba(92,122,79,0.25);}
  .sync-dot.off{background:#8A8578;box-shadow:none;}
  .sync-dot.pending{background:#C8983D;box-shadow:0 0 0 3px rgba(200,152,61,0.25);}

  main{flex:1;padding:34px 40px 60px;max-width:1120px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .pagehead h1{font-size:28px;font-weight:600;margin:0;letter-spacing:0.2px;text-wrap:balance;}
  .pagehead p{margin:4px 0 0;color:var(--muted);font-size:13.5px;}

  button{font-family:'Inter';cursor:pointer;border:none;border-radius:3px;font-weight:600;font-size:14px;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brick);outline-offset:2px;}
  .btn-primary{background:var(--text);color:var(--surface);padding:10px 18px;}
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{background:transparent;color:var(--text);padding:8px 13px;border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--text);}
  .btn-danger{background:transparent;color:var(--brick);padding:6px 10px;font-size:13px;}
  .btn-danger:hover{background:var(--brick-soft);}
  .btn-olive{background:var(--olive);color:var(--surface);padding:6px 12px;font-size:13px;}
  .btn-olive:hover{opacity:0.88;}
  .btn-small{padding:6px 12px;font-size:13px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-top:3px solid var(--text);
    padding:16px 18px;
  }
  .stat.accent{border-top-color:var(--brick);}
  .stat.olive{border-top-color:var(--olive);}
  .stat-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:6px;}
  .stat-num{font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
  .stat-sub{font-size:12px;color:var(--muted);margin-top:4px;}

  .panel{background:var(--surface);border:1px solid var(--border);margin-bottom:22px;}
  .panel-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .panel-head h2{font-size:17px;font-weight:600;margin:0;}
  .panel-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:9px 18px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;}
  td{padding:11px 18px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--bg-soft);}
  tr.flash td{background:var(--flash);transition:background-color 1.2s ease;}
  @media (prefers-reduced-motion:reduce){ tr.flash td{transition:none;} }
  .tag{display:inline-block;padding:3px 9px;border-radius:2px;font-size:12px;font-weight:600;}
  .tag-olive{background:var(--olive-soft);color:var(--olive);}
  .tag-off{background:var(--bg-soft);color:var(--muted);}

  .toolbar{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;background:var(--surface);}
  input,select{font-family:'Inter';padding:8px 10px;border:1.5px solid var(--border);border-radius:3px;font-size:14px;background:var(--surface);color:var(--text);}
  input:focus,select:focus{outline:none;border-color:var(--text);}
  .search{flex:1;min-width:170px;}

  .empty{padding:44px 18px;text-align:center;color:var(--muted);}
  .empty h3{color:var(--text);font-size:17px;margin-bottom:6px;}

  .modal-bg{position:fixed;inset:0;background:rgba(10,12,16,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--surface);width:440px;max-width:100%;max-height:88vh;overflow-y:auto;border-top:4px solid var(--brick);}
  .modal-head{padding:20px 24px 10px;}
  .modal-head h2{margin:0;font-size:19px;}
  .modal-body{padding:4px 24px 22px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px;}
  .field input,.field select{width:100%;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;min-width:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .rotation-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .day-col{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--olive);min-height:180px;}
  .day-col-head{padding:11px 13px;font-weight:600;font-size:14.5px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .day-col-head span{font-size:12px;color:var(--muted);font-weight:400;}
  .day-athlete{padding:10px 13px;border-bottom:1px solid var(--bg-soft);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .day-athlete .goal{color:var(--muted);font-size:11px;}
  .day-athlete button{background:none;border:none;color:var(--muted);font-size:16px;line-height:1;padding:2px;}
  .day-athlete button:hover{color:var(--brick);}
  .unassigned{margin-top:18px;}

  .note{background:var(--olive-soft);border-left:3px solid var(--olive);padding:11px 15px;font-size:13px;color:var(--text);margin-bottom:18px;}

  .loadscreen{min-height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);color:var(--muted);font-size:14px;text-align:center;padding:24px;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{
      width:100%;
      flex-direction:row;
      align-items:center;
      padding:0;
      overflow-x:auto;
      position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    }
    .sidebar::after{display:none;}
    .brand{display:flex;align-items:center;padding:10px 14px;border-bottom:none;margin-bottom:0;}
    .brand-sub{display:none;}
    .navitem{
      flex:1 0 auto;
      padding:14px 12px;
      border-left:none;
      border-bottom:3px solid transparent;
      justify-content:center;
      font-size:13.5px;
      white-space:nowrap;
    }
    .navitem.active{border-left:none;border-bottom-color:var(--sidebar-accent);}
    .navitem .lane-num{display:none;}
    .sync{display:none;}

    main{padding:20px 16px 40px;max-width:100%;}
    .pagehead{flex-direction:column;align-items:flex-start;gap:10px;}
    .pagehead h1{font-size:23px;}

    .stat-row{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
    .stat{padding:13px;}
    .stat-num{font-size:24px;}

    table{font-size:12.5px;}
    th,td{padding:9px 12px;}
    .panel{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .panel table{min-width:560px;}

    .rotation-grid{grid-template-columns:1fr;}

    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar select, .toolbar input{width:100%;}

    .modal{width:100%;max-width:100%;position:fixed;bottom:0;left:0;right:0;max-height:92vh;border-radius:10px 10px 0 0;}
    .modal-bg{align-items:flex-end;padding:0;}
    .field-row{flex-direction:column;gap:0;}
  }
</style>
<div id="app"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useMemo, useRef } = React;
const h = React.createElement;

const GROUPS = ['Avanzados','Intermedios 1','Intermedios 2','Principiantes','Triatlón'];
const WEEKDAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function currentPeriodKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function periodLabel(key){ const [y,m]=key.split('-'); return MONTHS_ES[parseInt(m,10)-1]+' '+y; }
function fmtMoney(n){ return '$' + Number(n||0).toLocaleString('es-MX'); }

function emptyForm(){
  return { id:null, nombre:'', modalidad:'Presencial', grupo:'Avanzados', ciudad:'',
    mensualidad:'', diaCobro:'1', meta:'', estado:'Activo', rotationDay:null };
}

// ---------- realtime data hook ----------
function useTeamData(){
  const [db,setDb] = useState(undefined); // undefined=checking, null=unavailable
  const [athletes,setAthletes] = useState(null); // null=loading
  const [flash,setFlash] = useState({});
  const [period,setPeriod] = useState(currentPeriodKey());
  const [paidIds,setPaidIds] = useState(new Set());
  const firstAthSnap = useRef(true);

  useEffect(()=>{
    let alive = true;
    (async()=>{
      let d = null;
      try{ d = window.claude ? await window.claude.use('db') : null; }catch(e){ d = null; }
      if(alive) setDb(d);
    })();
    return ()=>{ alive=false; };
  },[]);

  useEffect(()=>{
    if(!db) return;
    firstAthSnap.current = true;
    const unsub = db.collection('athletes').onSnapshot(snap=>{
      const list = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      list.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
      setAthletes(list);
      if(!firstAthSnap.current){
        const changedIds = snap.docChanges().filter(c=>c.type!=='removed').map(c=>c.doc.id);
        if(changedIds.length){
          setFlash(prev=>{ const n={...prev}; changedIds.forEach(id=>n[id]=true); return n; });
          changedIds.forEach(id=>{
            setTimeout(()=>{ setFlash(prev=>{ if(!prev[id]) return prev; const n={...prev}; delete n[id]; return n; }); },1300);
          });
        }
      }
      firstAthSnap.current = false;
    }, err=>{ console.warn('athletes onSnapshot', err); });
    return unsub;
  },[db]);

  useEffect(()=>{
    if(!db) return;
    setPaidIds(new Set());
    const path = 'payments/'+period+'/entries';
    const unsub = db.collection(path).onSnapshot(snap=>{
      setPaidIds(new Set(snap.docs.map(d=>d.id)));
    }, err=>{ console.warn('payments onSnapshot', err); });
    return unsub;
  },[db,period]);

  function upsertAthlete(form){
    if(!db) return;
    const body = {
      nombre: form.nombre.trim(),
      modalidad: form.modalidad,
      grupo: form.modalidad==='Presencial' ? form.grupo : '',
      ciudad: form.modalidad==='Online' ? form.ciudad.trim() : '',
      mensualidad: Number(form.mensualidad)||0,
      diaCobro: Number(form.diaCobro)||1,
      meta: (form.meta||'').trim(),
      estado: form.estado || 'Activo',
      rotationDay: form.rotationDay || null,
      fechaAlta: form.fechaAlta || todayISO(),
    };
    const col = db.collection('athletes');
    if(form.id){
      col.doc(form.id).set(body).catch(e=>console.warn('set athlete',e));
    }else{
      if(body.modalidad==='Online' && !body.rotationDay){
        body.rotationDay = WEEKDAYS[Math.floor(Math.random()*WEEKDAYS.length)];
      }
      col.add(body).catch(e=>console.warn('add athlete',e));
    }
  }
  function setEstado(id,estado){
    if(!db) return;
    db.collection('athletes').doc(id).update({estado}).catch(e=>console.warn('setEstado',e));
  }
  function assignRotationDay(id,day){
    if(!db) return;
    db.collection('athletes').doc(id).update({rotationDay:day}).catch(e=>console.warn('rotationDay',e));
  }
  function togglePaid(athleteId){
    if(!db) return;
    const ref = db.collection('payments/'+period+'/entries').doc(athleteId);
    if(paidIds.has(athleteId)) ref.delete().catch(e=>console.warn('unpay',e));
    else ref.set({paid:true, paidAt:new Date().toISOString()}).catch(e=>console.warn('pay',e));
  }

  return { db, athletes, flash, period, setPeriod, paidIds, upsertAthlete, setEstado, assignRotationDay, togglePaid };
}

function App(){
  const data = useTeamData();
  const [tab,setTab] = useState('dashboard');
  const [modal,setModal] = useState(null); // {mode:'new'|'edit', form}
  const [search,setSearch] = useState('');
  const [filterMod,setFilterMod] = useState('Todos');
  const [filterEstado,setFilterEstado] = useState('Activo');

  // Hooks must run unconditionally on every render (Rules of Hooks) — so
  // useMemo runs here, before any early return below, using a safe empty
  // list while the data is still loading.
  const athletesList = data.athletes || [];
  const visibleAthletes = useMemo(()=>{
    return athletesList.filter(a=>{
      if(filterMod!=='Todos' && a.modalidad!==filterMod) return false;
      if(filterEstado!=='Todos' && a.estado!==filterEstado) return false;
      if(search && !a.nombre.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  },[athletesList,filterMod,filterEstado,search]);

  if(data.db === undefined){
    return h('div',{className:'loadscreen'}, 'Conectando con tu equipo…');
  }
  if(data.db === null){
    return h('div',{className:'loadscreen'}, [
      h('h2',{key:'h',style:{fontFamily:'Oswald',color:'var(--text)',margin:0}},'Team Barrera'),
      h('p',{key:'p',style:{maxWidth:360}}, 'No se pudo conectar el panel en tiempo real desde esta vista. Ábrelo desde tu enlace en Claude, con tu sesión iniciada, para ver y editar los datos sincronizados.'),
    ]);
  }
  if(data.athletes === null){
    return h('div',{className:'loadscreen'}, 'Cargando atletas…');
  }

  const athletes = athletesList;
  const active = athletes.filter(a=>a.estado==='Activo');
  const activePresencial = active.filter(a=>a.modalidad==='Presencial');
  const activeOnline = active.filter(a=>a.modalidad==='Online');
  const totalMensual = active.reduce((s,a)=>s+(Number(a.mensualidad)||0),0);
  const promedio = active.length ? Math.round(totalMensual/active.length) : 0;
  const paidThisPeriod = active.filter(a=>data.paidIds.has(a.id));
  const pendingThisPeriod = active.filter(a=>!data.paidIds.has(a.id));
  const collected = paidThisPeriod.reduce((s,a)=>s+(Number(a.mensualidad)||0),0);
  const pendingAmt = pendingThisPeriod.reduce((s,a)=>s+(Number(a.mensualidad)||0),0);

  return h('div',{id:'app'},[
    Sidebar({tab,setTab,synced:true}),
    h('main',{key:'main'},[
      tab==='dashboard' && Dashboard({active,activePresencial,activeOnline,totalMensual,promedio,collected,pendingAmt,pendingThisPeriod,period:data.period,flash:data.flash}),
      tab==='atletas' && Atletas({visibleAthletes,search,setSearch,filterMod,setFilterMod,filterEstado,setFilterEstado,setModal,setEstado:data.setEstado,flash:data.flash}),
      tab==='pagos' && Pagos({active,period:data.period,setPeriod:data.setPeriod,paidIds:data.paidIds,togglePaid:data.togglePaid,collected,pendingAmt}),
      tab==='rotacion' && Rotacion({activeOnline,assignRotationDay:data.assignRotationDay}),
    ]),
    modal && h(Modal,{key:'modal',modal,setModal,upsertAthlete:data.upsertAthlete}),
  ]);
}

function Sidebar({tab,setTab}){
  const items = [
    {key:'dashboard',label:'Dashboard',n:'01'},
    {key:'atletas',label:'Atletas',n:'02'},
    {key:'pagos',label:'Pagos',n:'03'},
    {key:'rotacion',label:'Rotación',n:'04'},
  ];
  return h('div',{className:'sidebar',key:'sidebar'},[
    h('div',{className:'brand',key:'b'},[
      h('div',{className:'brand-name',key:'n'},'Team Barrera'),
      h('span',{className:'brand-sub',key:'s'},'Panel de control'),
    ]),
    ...items.map(it=>h('div',{
      key:it.key,
      className:'navitem'+(tab===it.key?' active':''),
      onClick:()=>setTab(it.key),
    },[h('span',{className:'lane-num',key:'n'},it.n),it.label])),
    h('div',{className:'sync',key:'sync'},[
      h('span',{className:'sync-dot',key:'d'}),
      'Sincronizado en tiempo real',
    ]),
  ]);
}

function Stat(label,num,sub,cls){
  return h('div',{className:'stat'+(cls?' '+cls:''),key:label},[
    h('div',{className:'stat-label',key:'l'},label),
    h('div',{className:'stat-num',key:'n'},num),
    h('div',{className:'stat-sub',key:'s'},sub),
  ]);
}

function Dashboard({active,activePresencial,activeOnline,totalMensual,promedio,collected,pendingAmt,pendingThisPeriod,period,flash}){
  return h(React.Fragment,{key:'dash'},[
    h('div',{className:'pagehead',key:'h'},[
      h('div',{key:'l'},[
        h('h1',{key:'t'},'Dashboard'),
        h('p',{key:'p'},'Vista general de tu equipo — '+periodLabel(period)),
      ]),
    ]),
    h('div',{className:'stat-row',key:'stats'},[
      Stat('Atletas activos', active.length, activePresencial.length+' presencial · '+activeOnline.length+' online'),
      Stat('Ingreso mensual esperado', fmtMoney(totalMensual), 'Promedio '+fmtMoney(promedio)+' por atleta','accent'),
      Stat('Cobrado este mes', fmtMoney(collected), (active.length-pendingThisPeriod.length)+' de '+active.length+' atletas','olive'),
      Stat('Pendiente por cobrar', fmtMoney(pendingAmt), pendingThisPeriod.length+' atleta(s)','accent'),
    ]),
    h('div',{className:'panel',key:'pending'},[
      h('div',{className:'panel-head',key:'h'}, h('h2',{key:'t'},'Pendientes de '+periodLabel(period))),
      pendingThisPeriod.length===0
        ? h('div',{className:'empty',key:'e'},[h('h3',{key:'h'},'Todo cobrado'),'Nadie pendiente este mes.'])
        : h('div',{className:'panel-scroll',key:'sc'}, h('table',{},[
            h('thead',{key:'h'},h('tr',{},['Atleta','Grupo/Ciudad','Día','Monto'].map(x=>h('th',{key:x},x)))),
            h('tbody',{key:'b'}, [...pendingThisPeriod]
              .sort((a,b)=>(Number(a.diaCobro)||0)-(Number(b.diaCobro)||0))
              .map(a=>h('tr',{key:a.id,className:flash[a.id]?'flash':''},[
                h('td',{key:'n'},a.nombre),
                h('td',{key:'g'},a.modalidad==='Presencial'?a.grupo:a.ciudad),
                h('td',{key:'d'},a.diaCobro),
                h('td',{key:'m'},fmtMoney(a.mensualidad)),
              ]))),
          ])),
    ]),
  ]);
}

function Atletas({visibleAthletes,search,setSearch,filterMod,setFilterMod,filterEstado,setFilterEstado,setModal,setEstado,flash}){
  const presencial = visibleAthletes.filter(a=>a.modalidad==='Presencial');
  const online = visibleAthletes.filter(a=>a.modalidad==='Online');
  return h(React.Fragment,{key:'atl'},[
    h('div',{className:'pagehead',key:'h'},[
      h('div',{key:'l'},[
        h('h1',{key:'t'},'Atletas'),
        h('p',{key:'p'},visibleAthletes.length+' resultado(s) — '+presencial.length+' presencial, '+online.length+' online'),
      ]),
      h('button',{className:'btn-primary',key:'add',onClick:()=>setModal({mode:'new',form:emptyForm()})},'+ Dar de alta'),
    ]),
    h('div',{className:'panel',key:'toolp'},
      h('div',{className:'toolbar',key:'tb'},[
        h('input',{className:'search',id:'search-atletas',key:'s',placeholder:'Buscar por nombre…',value:search,onChange:e=>setSearch(e.target.value)}),
        h('select',{id:'filtro-modalidad',key:'m',value:filterMod,onChange:e=>setFilterMod(e.target.value)},
          ['Todos','Presencial','Online'].map(o=>h('option',{key:o,value:o},o))),
        h('select',{id:'filtro-estado',key:'e',value:filterEstado,onChange:e=>setFilterEstado(e.target.value)},
          ['Activo','Inactivo','Todos'].map(o=>h('option',{key:o,value:o},o))),
      ]),
    ),
    AthleteTable('Presencial', presencial, setModal, setEstado, flash),
    AthleteTable('Online', online, setModal, setEstado, flash),
  ]);
}

function AthleteTable(title, list, setModal, setEstado, flash){
  return h('div',{className:'panel',key:title},[
    h('div',{className:'panel-head',key:'h'},[
      h('h2',{key:'t'},title),
      h('span',{key:'c',style:{fontSize:12.5,color:'var(--muted)'}},list.length+' atleta(s)'),
    ]),
    list.length===0
      ? h('div',{className:'empty',key:'e'},[h('h3',{key:'h'},'Sin resultados'),'Ajusta la búsqueda o da de alta a alguien nuevo.'])
      : h('div',{className:'panel-scroll',key:'sc'}, h('table',{},[
          h('thead',{key:'h'},h('tr',{},['Nombre',(title==='Presencial'?'Grupo':'Ciudad'),'Mensualidad','Día','Meta','Estado',''].map(x=>h('th',{key:x},x)))),
          h('tbody',{key:'b'},list.map(a=>h('tr',{key:a.id,className:flash[a.id]?'flash':''},[
            h('td',{key:'n'},a.nombre),
            h('td',{key:'g'},title==='Presencial'?a.grupo:a.ciudad),
            h('td',{key:'$'},fmtMoney(a.mensualidad)),
            h('td',{key:'d'},a.diaCobro),
            h('td',{key:'me',style:{color:'var(--muted)',fontSize:'13px'}},a.meta||'—'),
            h('td',{key:'es'},h('span',{className:'tag '+(a.estado==='Activo'?'tag-olive':'tag-off')},a.estado)),
            h('td',{key:'act',style:{whiteSpace:'nowrap'}},[
              h('button',{className:'btn-small btn-ghost',key:'edit',style:{marginRight:6},onClick:()=>setModal({mode:'edit',form:{...a}})},'Editar'),
              a.estado==='Activo'
                ? h('button',{className:'btn-danger',key:'deact',onClick:()=>setEstado(a.id,'Inactivo')},'Dar de baja')
                : h('button',{className:'btn-olive',key:'react',onClick:()=>setEstado(a.id,'Activo')},'Reactivar'),
            ]),
          ]))),
        ])),
  ]);
}

function Pagos({active,period,setPeriod,paidIds,togglePaid,collected,pendingAmt}){
  const sorted = [...active].sort((a,b)=>(Number(a.diaCobro)||0)-(Number(b.diaCobro)||0));
  function shiftPeriod(delta){
    const [y,m] = period.split('-').map(Number);
    const d = new Date(y, m-1+delta, 1);
    setPeriod(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return h(React.Fragment,{key:'pagos'},[
    h('div',{className:'pagehead',key:'h'},[
      h('div',{key:'l'},[
        h('h1',{key:'t'},'Pagos'),
        h('p',{key:'p'},'Cobrado '+fmtMoney(collected)+' · Pendiente '+fmtMoney(pendingAmt)),
      ]),
      h('div',{key:'nav',style:{display:'flex',gap:8,alignItems:'center'}},[
        h('button',{className:'btn-ghost btn-small',key:'prev',onClick:()=>shiftPeriod(-1),'aria-label':'Mes anterior'},'←'),
        h('div',{key:'lbl',style:{fontFamily:'Oswald',fontSize:16,minWidth:130,textAlign:'center'}},periodLabel(period)),
        h('button',{className:'btn-ghost btn-small',key:'next',onClick:()=>shiftPeriod(1),'aria-label':'Mes siguiente'},'→'),
      ]),
    ]),
    h('div',{className:'panel',key:'panel'},
      active.length===0
        ? h('div',{className:'empty',key:'e'},'Aún no tienes atletas activos.')
        : h('div',{className:'panel-scroll',key:'sc'}, h('table',{},[
            h('thead',{key:'h'},h('tr',{},['Día','Atleta','Grupo/Ciudad','Monto','Estado'].map(x=>h('th',{key:x},x)))),
            h('tbody',{key:'b'},sorted.map(a=>{
              const paid = paidIds.has(a.id);
              return h('tr',{key:a.id},[
                h('td',{key:'d'},a.diaCobro),
                h('td',{key:'n'},a.nombre),
                h('td',{key:'g'},a.modalidad==='Presencial'?a.grupo:a.ciudad),
                h('td',{key:'$'},fmtMoney(a.mensualidad)),
                h('td',{key:'s'},h('button',{
                  className: paid ? 'btn-small btn-olive' : 'btn-small btn-ghost',
                  onClick:()=>togglePaid(a.id),
                }, paid ? '✓ Pagado' : 'Marcar pagado')),
              ]);
            })),
          ])),
    ),
  ]);
}

function Rotacion({activeOnline,assignRotationDay}){
  const unassigned = activeOnline.filter(a=>!a.rotationDay);
  return h(React.Fragment,{key:'rot'},[
    h('div',{className:'pagehead',key:'h'},
      h('div',{key:'l'},[
        h('h1',{key:'t'},'Rotación online'),
        h('p',{key:'p'},'Reparte a tus '+activeOnline.length+' atletas online entre los días laborales'),
      ]),
    ),
    h('div',{className:'note',key:'note'},'Asigna cada atleta a un día. Cuando abras esta pestaña ese día, ya sabes a quién contactar.'),
    h('div',{className:'rotation-grid',key:'grid'}, WEEKDAYS.map(day=>{
      const list = activeOnline.filter(a=>a.rotationDay===day);
      return h('div',{className:'day-col',key:day},[
        h('div',{className:'day-col-head',key:'h'},[day,h('span',{key:'c'},list.length)]),
        ...list.map(a=>h('div',{className:'day-athlete',key:a.id},[
          h('div',{key:'i'},[a.nombre,h('div',{className:'goal',key:'g'},a.meta||'Sin meta')]),
          h('button',{key:'x',onClick:()=>assignRotationDay(a.id,null),title:'Quitar de este día','aria-label':'Quitar de este día'},'×'),
        ])),
      ]);
    })),
    unassigned.length>0 && h('div',{className:'panel unassigned',key:'un'},[
      h('div',{className:'panel-head',key:'h'},h('h2',{key:'t'},'Sin asignar ('+unassigned.length+')')),
      h('div',{className:'panel-scroll',key:'sc'}, h('table',{},[
        h('thead',{key:'h'},h('tr',{},['Atleta','Ciudad','Meta','Asignar a…'].map(x=>h('th',{key:x},x)))),
        h('tbody',{key:'b'},unassigned.map(a=>h('tr',{key:a.id},[
          h('td',{key:'n'},a.nombre),
          h('td',{key:'c'},a.ciudad),
          h('td',{key:'g',style:{fontSize:13,color:'var(--muted)'}},a.meta||'—'),
          h('td',{key:'s'},h('select',{
            defaultValue:'',
            onChange:e=>{ if(e.target.value) assignRotationDay(a.id,e.target.value); },
          },[h('option',{key:'',value:''},'Elegir día…'),...WEEKDAYS.map(d=>h('option',{key:d,value:d},d))])),
        ]))),
      ])),
    ]),
  ]);
}

function Modal({modal,setModal,upsertAthlete}){
  const [form,setForm] = useState(modal.form);
  function set(k,v){ setForm(prev=>({...prev,[k]:v})); }
  function submit(e){
    e.preventDefault();
    if(!form.nombre.trim()) return;
    upsertAthlete(form);
    setModal(null);
  }
  return h('div',{className:'modal-bg',onClick:e=>{ if(e.target===e.currentTarget) setModal(null); }},
    h('div',{className:'modal'},[
      h('div',{className:'modal-head',key:'h'},h('h2',{},modal.mode==='new'?'Dar de alta atleta':'Editar atleta')),
      h('form',{className:'modal-body',key:'b',onSubmit:submit},[
        Field('nombre','Nombre completo', h('input',{id:'nombre',required:true,value:form.nombre,onChange:e=>set('nombre',e.target.value)})),
        FieldRow([
          Field('modalidad','Modalidad', h('select',{id:'modalidad',value:form.modalidad,onChange:e=>set('modalidad',e.target.value)},
            ['Presencial','Online'].map(o=>h('option',{key:o,value:o},o)))),
          form.modalidad==='Presencial'
            ? Field('grupo','Grupo', h('select',{id:'grupo',value:form.grupo,onChange:e=>set('grupo',e.target.value)},
                GROUPS.map(g=>h('option',{key:g,value:g},g))))
            : Field('ciudad','Ciudad', h('input',{id:'ciudad',value:form.ciudad,onChange:e=>set('ciudad',e.target.value)})),
        ]),
        FieldRow([
          Field('mensualidad','Mensualidad (MXN)', h('input',{id:'mensualidad',type:'number',required:true,value:form.mensualidad,onChange:e=>set('mensualidad',e.target.value)})),
          Field('diaCobro','Día de cobro', h('input',{id:'diaCobro',type:'number',min:1,max:31,required:true,value:form.diaCobro,onChange:e=>set('diaCobro',e.target.value)})),
        ]),
        Field('meta','Meta / carrera (opcional)', h('input',{id:'meta',value:form.meta,onChange:e=>set('meta',e.target.value)})),
        h('div',{className:'modal-actions',key:'act'},[
          h('button',{type:'button',className:'btn-ghost',key:'c',onClick:()=>setModal(null)},'Cancelar'),
          h('button',{type:'submit',className:'btn-primary',key:'s'},modal.mode==='new'?'Dar de alta':'Guardar cambios'),
        ]),
      ]),
    ]),
  );
}
function Field(id,label,input){ return h('div',{className:'field',key:id},[h('label',{key:'l',htmlFor:id},label),input]); }
function FieldRow(fields){ return h('div',{className:'field-row'},fields); }

class ErrorBoundary extends React.Component{
  constructor(props){ super(props); this.state = {error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error,info){ console.error('Team Barrera crash:', error, info); }
  render(){
    if(this.state.error){
      return h('div',{className:'loadscreen'},[
        h('h2',{key:'h',style:{fontFamily:'Oswald',color:'var(--text)',margin:0}},'Algo salió mal'),
        h('p',{key:'p',style:{maxWidth:360}},'El panel tuvo un error inesperado al cargar. Intenta recargar la página; si sigue pasando, avísale a quien lo construyó.'),
      ]);
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('app')).render(h(ErrorBoundary,null,h(App)));
</script>
